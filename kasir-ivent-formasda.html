<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kasir Ivent Formasda</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--text:#18322b;--muted:#6f7f78;--accent:#146c52;--accent2:#0f563f;--line:#dfe7e3;--danger:#b42318;--shadow:0 10px 30px rgba(20,40,32,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:auto;padding:14px 18px}
.head{display:flex;align-items:center;gap:14px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
h1{font-size:22px;margin:0 0 4px}
.small{font-size:12px;color:var(--muted)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn{background:var(--accent);color:white}
.btn:hover{background:var(--accent2)}
.btn-light{background:#eef4f1;color:var(--text)}
.btn-danger{background:#fcebea;color:#8a1c13}
.layout{display:grid;grid-template-columns:1.55fr .95fr;gap:18px;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0;padding:16px;border-bottom:1px solid var(--line)}
.pad{padding:16px}
.search-row{display:grid;grid-template-columns:1fr 170px;gap:10px;margin-bottom:12px}
input,select{width:100%;padding:11px 12px;border:1px solid #cfdad5;border-radius:10px;outline:none;font-size:14px;background:#fff}
input:focus,select:focus{border-color:var(--accent)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:#eef4f1;color:var(--text)}
.tab.active{background:var(--accent);color:#fff}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.product{border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.product .name{font-weight:700;line-height:1.25}
.price{margin-top:5px;font-size:13px;color:var(--muted)}
.product button{white-space:nowrap;padding:9px 11px}
.cart-list{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto}
.cart-item{border:1px solid var(--line);border-radius:12px;padding:11px}
.cart-top{display:flex;justify-content:space-between;gap:12px}
.cart-name{font-weight:700}
.qty-row{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.qty{display:flex;align-items:center;gap:7px}
.qty button{width:30px;height:30px;padding:0;background:#edf3f0}
.total-box{margin-top:14px;padding:14px;background:#f0f6f3;border-radius:12px}
.total-line{display:flex;justify-content:space-between;gap:12px;margin:7px 0}
.total-line.grand{font-size:20px;font-weight:800}
label{display:block;font-size:12px;font-weight:700;margin:12px 0 6px}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay-option{border:1px solid var(--line);padding:12px;border-radius:11px;cursor:pointer}
.pay-option.active{border:2px solid var(--accent);background:#f0f7f4}
.pay-option input{width:auto;margin-right:7px}
.qris{display:none;margin-top:12px;text-align:center}
.qris img{max-width:220px;width:100%;border-radius:12px;border:1px solid var(--line)}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.history{padding-bottom:18px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f7faf8}
.empty{padding:24px;text-align:center;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#f7faf8;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px;margin-top:5px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:center;justify-content:center;padding:20px}
.modal-box{background:white;border-radius:16px;max-width:460px;width:100%;padding:18px}
.receipt{font-family:monospace;font-size:12px;line-height:1.45}
.receipt hr{border:0;border-top:1px dashed #999}
@media (max-width:900px){.layout{grid-template-columns:1fr}.products{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.products{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.search-row{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.top-actions{width:100%}}
@media print{
body{background:#fff}.no-print{display:none!important}.modal{position:static;background:none;padding:0}.modal-box{box-shadow:none;padding:0;max-width:none}.receipt{font-size:11px}
}
</style>
</head>
<body>
<header class="no-print">
  <div class="wrap head">
    <div class="brand">
      <img src="https://cdn.phototourl.com/member/2026-09-28-6f3cb77f-83c9-4cc8-8701-f613283bf8d6.jpg" alt="Logo">
      <div>
        <h1>Kasir Ivent Formasda</h1>
        <div class="small">Kasir event • data tersimpan di browser perangkat ini</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn-light" onclick="showHistory()">Riwayat</button>
      <button class="btn-light" onclick="showReport()">Laporan</button>
      <button class="btn-light" onclick="backupData()">Backup</button>
    </div>
  </div>
</header>

<main class="wrap layout no-print">
  <section class="card">
    <h2>Daftar Menu</h2>
    <div class="pad">
      <div class="search-row">
        <input id="search" placeholder="Cari menu..." oninput="renderProducts()">
        <select id="series" onchange="setSeries(this.value)"></select>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="products" id="products"></div>
    </div>
  </section>

  <section class="card">
    <h2>Pesanan</h2>
    <div class="pad">
      <label>Nama Pembeli</label>
      <input id="buyer" placeholder="Nama pembeli (opsional)">
      <label>Channel</label>
      <select id="channel">
        <option>Event</option>
        <option>WhatsApp</option>
        <option>GoFood</option>
        <option>Shopee Food</option>
        <option>GrabFood</option>
      </select>

      <label>Metode Pembayaran</label>
      <div class="pay-grid">
        <div class="pay-option active" data-pay="Cash" onclick="setPay('Cash',this)"><input type="radio" checked> Cash</div>
        <div class="pay-option" data-pay="QRIS" onclick="setPay('QRIS',this)"><input type="radio"> QRIS</div>
      </div>
      <div id="cashBox">
        <label>Uang Diterima</label>
        <input id="cash" type="number" min="0" placeholder="0" oninput="renderCart()">
      </div>
      <div class="qris" id="qrisBox">
        <div class="note">Scan QRIS untuk pembayaran.</div>
        <img src="https://cdn.phototourl.com/member/2026-09-29-0c428922-e3b2-440f-b86f-0b7839b3ef9e.jpg" alt="QRIS">
      </div>

      <div class="cart-list" id="cart"></div>
      <div class="total-box">
        <div class="total-line"><span>Subtotal</span><b id="subtotal">Rp 0</b></div>
        <div class="total-line" id="changeLine" style="display:none"><span>Kembalian</span><b id="change">Rp 0</b></div>
        <div class="total-line grand"><span>Total</span><b id="total">Rp 0</b></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button class="btn" onclick="saveSale()">Simpan Transaksi</button>
        <button class="btn-light" onclick="clearCart()">Kosongkan</button>
      </div>
      <div class="note" style="margin-top:10px">Nomor WhatsApp kontak: <b>0857 2667 7641</b></div>
    </div>
  </section>
</main>

<section class="wrap no-print history">
  <div class="card">
    <h2>Riwayat Transaksi</h2>
    <div class="pad">
      <div class="stats" id="stats"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0">
        <input id="historyDate" type="date" onchange="renderHistory()">
        <select id="historyChannel" onchange="renderHistory()">
          <option value="">Semua Channel</option>
          <option>Event</option><option>WhatsApp</option><option>GoFood</option><option>Shopee Food</option><option>GrabFood</option>
        </select>
        <input id="historySearch" placeholder="Cari nama pembeli..." oninput="renderHistory()">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Waktu</th><th>Pembeli</th><th>Channel</th><th>Pembayaran</th><th>Item</th><th>Total</th><th></th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<div class="modal" id="modal">
  <div class="modal-box">
    <div id="modalContent"></div>
    <div class="no-print" style="display:flex;gap:8px;margin-top:14px">
      <button class="btn" onclick="window.print()">Cetak</button>
      <button class="btn-light" onclick="closeModal()">Tutup</button>
    </div>
  </div>
</div>

<script>
const KEY='kasir_ivent_formasda_v1';
const WA='6285726677641';
const PRODUCTS=[
  ['French Fries','STD',18000,'Food'],
  ['Nugget','STD',23000,'Food'],
  ['Mix Platter','STD',35000,'Food'],
  ['Intuisi Sweet Toast','STD',23000,'Food'],
  ['Milo Tea','STD',20000,'Tea Series'],
  ['Lemon Tea','STD',15000,'Tea Series'],
  ['Lychee Tea','STD',15000,'Tea Series'],
  ['Macha','S',25000,'Milk Base'],
  ['Choco Milo','S',23000,'Milk Base'],
  ['Oreo','S',25000,'Milk Base'],
  ['Amerikano','M',20000,'Coffee Base'],
  ['Intuisi Latte','M',23000,'Coffee Base'],
  ['Aren Latte','M',25000,'Coffee Base'],
  ['Butterscotch Latte','M',25000,'Coffee Base'],
  ['Caramel Macchiato','M',28000,'Coffee Base'],
  ['Blue Ocean','M',25000,'Mocktail'],
  ['Lemon Squash','M',25000,'Mocktail'],
  ['Peach Squash','M',30000,'Mocktail'],
  ['Lychee Squash','M',30000,'Mocktail'],
  ['Combo Big Twins (2 French Fries + Jasmine)','STD',35000,'Paket Combo']
].map((x,i)=>({id:i+1,name:x[0],size:x[1],price:x[2],series:x[3]}));

let cart=[]; let payment='Cash'; let activeSeries='Semua';

function rupiah(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n).replace('IDR','Rp').replace(',00','')}
function loadSales(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function saveSales(s){localStorage.setItem(KEY,JSON.stringify(s))}
function today(){return new Date().toISOString().slice(0,10)}

function init(){
  const series=[...new Set(PRODUCTS.map(p=>p.series))];
  const sel=document.getElementById('series');
  sel.innerHTML='<option>Semua</option>'+series.map(s=>'<option>'+s+'</option>').join('');
  document.getElementById('historyDate').value=today();
  renderTabs(); renderProducts(); renderCart(); renderHistory(); renderStats();
}
function setSeries(v){activeSeries=v; renderTabs(); renderProducts()}
function renderTabs(){
 const all=['Semua',...new Set(PRODUCTS.map(p=>p.series))];
 document.getElementById('tabs').innerHTML=all.map(s=>'<button class="tab '+(activeSeries===s?'active':'')+'" onclick="setSeries(\''+s.replace(/'/g,"\\'")+'\')">'+s+'</button>').join('');
}
function renderProducts(){
 const q=(document.getElementById('search').value||'').toLowerCase().trim();
 let arr=PRODUCTS.filter(p=>(activeSeries==='Semua'||p.series===activeSeries)&&(!q||p.name.toLowerCase().includes(q)));
 document.getElementById('products').innerHTML=arr.length?arr.map(p=>'<div class="product"><div><div class="name">'+esc(p.name)+'</div><div class="price">'+p.series+' • '+p.size+' • '+rupiah(p.price)+'</div></div><button class="btn" onclick="addToCart('+p.id+')">Tambah</button></div>').join(''):'<div class="empty">Menu tidak ditemukan.</div>';
}
function addToCart(id){const p=PRODUCTS.find(x=>x.id===id);const f=cart.find(x=>x.id===id);if(f)f.qty++;else cart.push({...p,qty:1});renderCart()}
function changeQty(id,d){const f=cart.find(x=>x.id===id);if(!f)return;f.qty+=d;if(f.qty<=0)cart=cart.filter(x=>x.id!==id);renderCart()}
function clearCart(){cart=[];document.getElementById('cash').value='';renderCart()}
function subtotal(){return cart.reduce((s,x)=>s+x.price*x.qty,0)}
function renderCart(){
 const el=document.getElementById('cart');
 el.innerHTML=cart.length?cart.map(x=>'<div class="cart-item"><div class="cart-top"><div><div class="cart-name">'+esc(x.name)+'</div><div class="small">'+x.size+' • '+rupiah(x.price)+'</div></div><b>'+rupiah(x.price*x.qty)+'</b></div><div class="qty-row"><div class="qty"><button onclick="changeQty('+x.id+',-1)">−</button><b>'+x.qty+'</b><button onclick="changeQty('+x.id+',1)">+</button></div><button class="btn-danger" onclick="removeItem('+x.id+')">Hapus</button></div></div>').join(''):'<div class="empty">Keranjang masih kosong.</div>';
 const t=subtotal();document.getElementById('subtotal').textContent=rupiah(t);document.getElementById('total').textContent=rupiah(t);
 const line=document.getElementById('changeLine');const cash=Number(document.getElementById('cash').value||0);
 if(payment==='Cash'){line.style.display='flex';document.getElementById('change').textContent=rupiah(Math.max(0,cash-t))}else line.style.display='none';
}
function removeItem(id){cart=cart.filter(x=>x.id!==id);renderCart()}
function setPay(v,el){
 payment=v;document.querySelectorAll('.pay-option').forEach(x=>x.classList.remove('active'));el.classList.add('active');
 document.getElementById('cashBox').style.display=v==='Cash'?'block':'none';
 document.getElementById('qrisBox').style.display=v==='QRIS'?'block':'none';renderCart()
}
function saveSale(){
 if(!cart.length)return alert('Keranjang masih kosong.');
 const total=subtotal();const cash=Number(document.getElementById('cash').value||0);
 if(payment==='Cash'&&cash<total)return alert('Uang diterima masih kurang.');
 const sale={id:Date.now(),time:new Date().toISOString(),buyer:(document.getElementById('buyer').value||'Umum').trim(),channel:document.getElementById('channel').value,payment,total,cash:payment==='Cash'?cash:null,change:payment==='Cash'?cash-total:null,items:cart.map(x=>({name:x.name,size:x.size,price:x.price,qty:x.qty}))};
 const sales=loadSales();sales.push(sale);saveSales(sales);showReceipt(sale);cart=[];document.getElementById('buyer').value='';document.getElementById('cash').value='';renderCart();renderHistory();renderStats();
}
function showReceipt(s){
 const dt=new Date(s.time);
 const items=s.items.map(i=>esc(i.name)+' x'+i.qty+' '+rupiah(i.price*i.qty)).join('<br>');
 document.getElementById('modalContent').innerHTML='<div class="receipt"><div style="text-align:center"><b>KASIR IVENT FORMASDA</b><br>Struk Penjualan</div><hr><b>Waktu:</b> '+dt.toLocaleString('id-ID')+'<br><b>Pembeli:</b> '+esc(s.buyer)+'<br><b>Channel:</b> '+esc(s.channel)+'<br><b>Pembayaran:</b> '+esc(s.payment)+'<hr>'+items+'<hr><b>TOTAL: '+rupiah(s.total)+'</b>'+(s.payment==='Cash'?'<br>Cash: '+rupiah(s.cash)+'<br>Kembalian: '+rupiah(s.change): '')+'<hr><div style="text-align:center">Terima kasih</div></div>';
 document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none'}
function showReceiptById(id){const s=loadSales().find(x=>x.id===id);if(s)showReceipt(s)}
function renderHistory(){
 const date=document.getElementById('historyDate').value, ch=document.getElementById('historyChannel').value, q=(document.getElementById('historySearch').value||'').toLowerCase();
 let sales=loadSales().filter(s=>(!date||s.time.slice(0,10)===date)&&(!ch||s.channel===ch)&&(!q||s.buyer.toLowerCase().includes(q))).sort((a,b)=>b.id-a.id);
 const body=document.getElementById('historyBody');
 body.innerHTML=sales.length?sales.map(s=>'<tr><td>'+new Date(s.time).toLocaleString('id-ID')+'</td><td>'+esc(s.buyer)+'</td><td>'+esc(s.channel)+'</td><td>'+esc(s.payment)+'</td><td>'+s.items.reduce((n,i)=>n+i.qty,0)+'</td><td>'+rupiah(s.total)+'</td><td><button class="btn-light" onclick="showReceiptById('+s.id+')">Struk</button></td></tr>').join(''):'<tr><td colspan="7" class="empty">Belum ada transaksi.</td></tr>';
}
function renderStats(){
 const sales=loadSales();const d=today();const todaySales=sales.filter(s=>s.time.slice(0,10)===d);
 const omzet=todaySales.reduce((n,s)=>n+s.total,0);const qty=todaySales.reduce((n,s)=>n+s.items.reduce((m,i)=>m+i.qty,0),0);
 const avg=todaySales.length?Math.round(omzet/todaySales.length):0;
 document.getElementById('stats').innerHTML='<div class="stat">Transaksi hari ini<b>'+todaySales.length+'</b></div><div class="stat">Omzet hari ini<b>'+rupiah(omzet)+'</b></div><div class="stat">Item terjual<b>'+qty+'</b></div><div class="stat">Rata-rata<b>'+rupiah(avg)+'</b></div>';
}
function showHistory(){document.querySelector('.history').scrollIntoView({behavior:'smooth'})}
function showReport(){
 const sales=loadSales();const bySeries={};sales.forEach(s=>s.items.forEach(i=>{const p=PRODUCTS.find(x=>x.name===i.name&&x.size===i.size);const k=p?p.series:'Lainnya';bySeries[k]=(bySeries[k]||0)+i.qty}));
 const rows=Object.entries(bySeries).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v+'</td></tr>').join('');
 document.getElementById('modalContent').innerHTML='<h3 style="margin-top:0">Laporan Penjualan</h3><div class="table-wrap"><table><thead><tr><th>Series</th><th>Item Terjual</th></tr></thead><tbody>'+ (rows||'<tr><td colspan="2" class="empty">Belum ada data.</td></tr>') +'</tbody></table></div>';
 document.getElementById('modal').style.display='flex';
}
function backupData(){
 const data=JSON.stringify(loadSales(),null,2);const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-kasir-ivent-formasda-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);
}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
init();
</script>
</body>
</html>
