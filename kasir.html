<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intuisi.teh Kasir</title><style>body{font-family:Arial;margin:0;background:#f3f8ef;color:#173b25}.w{max-width:1100px;margin:auto;padding:12px}.h{background:#087336;color:#fff;padding:14px;border-radius:16px;text-align:center}.h img{max-width:330px;height:70px;object-fit:contain;background:#fff;border-radius:10px}.lay{display:grid;grid-template-columns:1.5fr .8fr;gap:12px;margin-top:12px}.b{background:#fff;border:1px solid #dce8d8;border-radius:15px;padding:12px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.i{border:1px solid #dce8d8;border-radius:10px;padding:9px;min-height:120px;display:flex;flex-direction:column}.i button,.save{margin-top:auto;background:#087336;color:#fff;border:0;border-radius:8px;padding:9px;font-weight:bold}.p{color:#087336;font-weight:bold;margin:5px 0}.r{padding:8px 0;border-bottom:1px solid #eee}.q button{padding:4px 9px}.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:bold;padding:10px 0}.f{display:grid;grid-template-columns:1fr 1fr;gap:7px}label{font-size:10px;font-weight:bold}input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #dce8d8;border-radius:8px}.wide{grid-column:1/-1}.pay{background:#f0f8ea;padding:10px;border-radius:9px;display:flex;justify-content:space-between;font-weight:bold}.qr{text-align:center;background:#f5faf2;padding:10px;border-radius:10px}.qr img{width:170px;max-width:100%}.hidden{display:none}.nav{display:flex;gap:7px;margin:10px 0}.nav button{padding:9px;border:0;border-radius:20px;background:#fff;color:#087336;font-weight:bold}.nav .on{background:#087336;color:#fff}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:7px;border-bottom:1px solid #eee;text-align:left;font-size:12px}@media(max-width:800px){.lay{grid-template-columns:1fr}.g{grid-template-columns:1fr 1fr}}@media(max-width:500px){.f{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div class="w"><div class="h"><img src="https://cdn.phototourl.com/member/2026-09-28-6f3cb77f-83c9-4cc8-8701-f613283bf8d6.jpg"><div><b>KASIR & PENJUALAN</b> • Intuisi.teh</div></div><div class="nav"><button id="k" class="on">🛒 Kasir</button><button id="h">📋 Riwayat</button></div><main id="app"><div class="lay"><div class="b"><input id="s" placeholder="Cari menu..." oninput="draw()"><div class="nav" id="cats"></div><div class="g" id="menus"></div></div><div class="b"><h3>Keranjang</h3><div id="cart"></div><div class="tot"><span>Total</span><span id="total">Rp0</span></div><div class="f"><div class="wide"><label>NAMA PEMBELI</label><input id="buyer" placeholder="Nama pembeli"></div><div><label>PEMBAYARAN</label><select id="method"><option>Cash</option><option>QRIS</option></select></div><div><label>CHANNEL</label><select id="channel"><option>Outlet</option><option>GoFood</option><option>Shopee Food</option><option>GrabFood</option><option>WhatsApp</option></select></div><div id="cash"><label>UANG DIBAYAR</label><input id="paid" type="number"></div><div id="chg"><label>KEMBALIAN</label><input id="change" readonly value="Rp0"></div><div class="wide pay"><span>Total yang harus dibayarkan</span><span id="must">Rp0</span></div><div id="qr" class="wide qr hidden"><b>SCAN QRIS</b><br><img src="https://cdn.phototourl.com/member/2026-09-29-0c428922-e3b2-440f-b86f-0b7839b3ef9e.jpg"></div></div><button class="save" onclick="save()">💾 Simpan Transaksi</button><a id="wa" style="display:block;text-align:center;margin-top:7px;background:#25d366;padding:10px;border-radius:8px;text-decoration:none;color:#07391c;font-weight:bold" target="_blank">WhatsApp</a><button style="width:100%;margin-top:7px;padding:9px;border:0;border-radius:8px" onclick="reset()">Transaksi Baru</button></div></div></main><section id="hist" class="b hidden"><h3>Riwayat Penjualan</h3><input id="dt" type="date" onchange="history()"><div id="hs"></div><table class="table"><thead><tr><th>Waktu</th><th>Pembeli</th><th>Menu</th><th>Bayar</th><th>Total</th></tr></thead><tbody id="rows"></tbody></table></section></div><script>
const M=[["Food","French Fries","STD",18000],["Food","Nugget","STD",20000],["Food","Scallop","STD",20000],["Food","Mix Platter","STD",20000],["Food","Original Burger","STD",15000],["Food","Cheese Burger","STD",20000],["Food","Double Cheese Burger","STD",25000],["Food","Toast Cokelat","STD",20000],["Food","Toast Cheese","STD",23000],["Food","Toast Choco Cheese","STD",25000],["Tea Series","Peach Tea","STD",15000],["Tea Series","Lemon Tea","STD",15000],["Tea Series","Lychee Tea","STD",15000],["Milk Base","Macha","S",30000],["Milk Base","Macha","M",35000],["Milk Base","Choco Milo","S",20000],["Milk Base","Choco Milo","M",25000],["Milk Base","Oreo","S",25000],["Milk Base","Oreo","M",30000],["Coffee Base","Long Black","M",20000],["Coffee Base","Intuisi Latte","M",25000],["Coffee Base","Spanish Latte","M",25000],["Coffee Base","Aren Latte","M",25000],["Coffee Base","Pandan Latte","M",28000],["Coffee Base","Pistacio Latte","M",30000],["Coffee Base","Caramel Macchiato","M",35000],["Mocktail","Blue Ocean","M",25000],["Mocktail","Lemon Squash","M",25000],["Mocktail","Peach Squash","M",30000],["Mocktail","Lychee Squash","M",30000],["Paket Combo","Combo Hemat","COMBO",25000],["Paket Combo","Combo Burger","COMBO",35000],["Paket Combo","Combo Double","COMBO",50000],["Paket Combo","Combo Toast","COMBO",35000],["Paket Combo","Combo Snack","COMBO",30000],["Paket Combo","Combo Nugget","COMBO",35000],["Paket Combo","Combo Scallop","COMBO",35000],["Paket Combo","Combo Big","COMBO",60000],["Paket Combo","Combo Berdua","COMBO",75000]];
let cat="Semua",bag=[],sales=JSON.parse(localStorage.getItem("intuisi-sales")||"[]"),rp=n=>"Rp"+(+n).toLocaleString("id-ID"),today=()=>new Date().toISOString().slice(0,10);
function draw(){let cs=["Semua",...new Set(M.map(x=>x[0]))];cats.innerHTML=cs.map(x=>'<button class="'+(x==cat?"on":"")+'" onclick="cat=\''+x+'\';draw()">'+x+"</button>").join("");let q=s.value.toLowerCase(),a=M.map((x,i)=>[x,i]).filter(z=>(cat=="Semua"||z[0][0]==cat)&&z[0][1].toLowerCase().includes(q));menus.innerHTML=a.map(z=>'<div class=i><b>'+z[0][1]+'</b><small>'+z[0][0]+' · '+z[0][2]+'</small><div class=p>'+rp(z[0][3])+'</div><button onclick="add('+z[1]+')">＋ Tambah</button></div>').join("")}
function add(i){let x=bag.find(a=>a.i==i);x?x.q++:bag.push({i,q:1});cartDraw()}
function cartDraw(){cart.innerHTML=bag.map(x=>'<div class=r><b>'+M[x.i][1]+'</b> × '+x.q+' — '+rp(M[x.i][3]*x.q)+'<div class=q><button onclick="qty('+x.i+',-1)">−</button><button onclick="qty('+x.i+',1)">＋</button></div></div>').join("")||"<small>Keranjang kosong</small>";let t=sum();total.textContent=rp(t);must.textContent=rp(t);change.value=rp(Math.max(0,(+paid.value||0)-t));wa()}
function qty(i,d){let x=bag.find(a=>a.i==i);x.q+=d;if(x.q<1)bag=bag.filter(a=>a.i!=i);cartDraw()}
function sum(){return bag.reduce((s,x)=>s+M[x.i][3]*x.q,0)}
function wa(){let l=bag.map(x=>M[x.i][1]+" x"+x.q).join("\n");wa.href=bag.length?"https://wa.me/6285726677641?text="+encodeURIComponent("Halo Intuisi.teh\nNama: "+(buyer.value||"Pelanggan")+"\n"+l+"\nTotal: "+rp(sum())+"\nPembayaran: "+method.value):"#"}
function pay(){let qr0=method.value=="QRIS";qr.classList.toggle("hidden",!qr0);cash.classList.toggle("hidden",qr0);chg.classList.toggle("hidden",qr0);cartDraw()}
function save(){let t=sum();if(!bag.length)return alert("Keranjang kosong.");if(method.value=="Cash"&&(+paid.value||0)<t)return alert("Uang dibayar kurang.");sales.push({date:today(),time:new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}),buyer:buyer.value||"Pelanggan",payment:method.value,total:t,channel:channel.value,items:bag.map(x=>({name:M[x.i][1],qty:x.q}))});localStorage.setItem("intuisi-sales",JSON.stringify(sales));alert("Transaksi tersimpan.");reset()}
function reset(){bag=[];buyer.value="";paid.value="";method.value="Cash";pay();cartDraw()}
function history(){let a=sales.filter(x=>x.date==dt.value),om=a.reduce((s,x)=>s+x.total,0);hs.innerHTML="Transaksi: <b>"+a.length+"</b> &nbsp; Omzet: <b>"+rp(om)+"</b>";rows.innerHTML=a.map(x=>'<tr><td>'+x.time+'</td><td>'+x.buyer+'</td><td>'+x.items.map(i=>i.name+" ×"+i.qty).join(", ")+'</td><td>'+x.payment+'</td><td>'+rp(x.total)+'</td></tr>').join("")||"<tr><td colspan=5>Belum ada transaksi.</td></tr>"}
k.onclick=()=>{app.classList.remove("hidden");hist.classList.add("hidden")};h.onclick=()=>{app.classList.add("hidden");hist.classList.remove("hidden");history()};method.onchange=pay;paid.oninput=cartDraw;buyer.oninput=wa;dt.value=today();draw();cartDraw();
</script></body></html>
